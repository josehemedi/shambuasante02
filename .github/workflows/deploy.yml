name: Deploy Shambua Sante Backend

on:
  push:
    branches:
      - main # ou master selon sa branche par défaut

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            cd /home/github-deployer/apps/gestion-hopital
            
            # Initialiser le dépôt du backend s'il n'est pas là, sinon tirer les changements
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch --all
              git reset --hard origin/main
            fi

            # Lancer les conteneurs du Backend (MySQL, Rabbit, Redis, SpringBoot)
            # Vérifier que .env contient LIVEKIT_API_KEY et LIVEKIT_API_SECRET
            if [ ! -f .env ] || ! grep -q '^LIVEKIT_API_KEY=.\+' .env 2>/dev/null; then
              echo "ATTENTION: LIVEKIT_API_KEY manquant dans .env — la teleconsultation ne fonctionnera pas."
            fi

            docker compose up -d --build
            
            # Nettoyer les anciennes images
            docker image prune -f
