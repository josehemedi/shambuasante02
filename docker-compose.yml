# =============================================================================
# Shambua Santé / Hospicloud — stack locale & staging professionnelle
# Usage:
#   cp .env.example .env
#   docker compose up -d --build
# API: http://localhost:8082/actuator/health
# RabbitMQ UI: http://localhost:15672 (guest/guest par défaut dans .env)
# =============================================================================

name: shambua-sante

services:
  mysql:
    image: mysql:8.4
    container_name: shambua-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hospicloud}
      MYSQL_USER: ${MYSQL_USER:-hospicloud}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme_app}
    ports:
      - "${MYSQL_PORT:-3310}:3306"
    volumes:
      - mysql_data_v2:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    networks:
      - shambua-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shambua-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - shambua-net

  redis:
    image: redis:7.4-alpine
    container_name: shambua-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - shambua-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: shambua-sante/hospicloud-api:${APP_VERSION:-1.0.0}
    container_name: shambua-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/hospicloud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-hospicloud}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-changeme_app}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-guest}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-guest}
      APP_REDIS_ENABLED: ${APP_REDIS_ENABLED:-false}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-shambua-change-me-in-production-use-long-secret-key-256bits}
      APP_ASYNC_STORAGE_DIR: /var/hospicloud/async
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-https://gestionhopital.softyik.com}
      # OpenAI — REQUIS en prod pour /ai-assistant (voir .env.example + README.Docker.md)
      # application-local.properties n'est PAS utilisé dans ce conteneur.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      AI_ENABLED: ${AI_ENABLED:-true}
      # LiveKit Cloud — obligatoire pour la téléconsultation (Settings → Keys)
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://hospicloud-nz8gfvan.livekit.cloud}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    ports:
      - "${APP_PORT:-8082}:8082"
    volumes:
      - async_storage:/var/hospicloud/async
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - shambua-net

volumes:
  mysql_data_v2:
  rabbitmq_data:
  redis_data:
  async_storage:

networks:
  shambua-net:
    driver: bridge
