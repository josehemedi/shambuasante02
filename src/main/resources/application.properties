# ===================================================================
# Configuration de l'Application Hospicloud
# ===================================================================
spring.application.name=Hospicloud
server.port=8082

# ===================================================================
# JWT & CORS
# ===================================================================
app.jwt.secret=shambua-sante-hospicloud-jwt-secret-key-change-in-production-256bits
app.jwt.expiration-ms=86400000
# Clé dédiée au chiffrement des messages chat (AES-256). À changer en production.
app.chat.encryption-key=shambua-sante-chat-encryption-key-change-in-production-256bits
# Origines CORS — inclut les sous-domaines dev (*.localhost) via fichier hosts Windows
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,http://*.localhost:*,https://localhost:*,https://127.0.0.1:*,https://*.localhost:*,http://192.168.*.*:*,https://192.168.*.*:*,http://10.*.*.*:*,https://10.*.*.*:*,http://172.16.*.*:*,https://172.16.*.*:*
app.cors.allowed-origins=

spring.mandatory-file-encoding=UTF-8

# Configuration de l'Application Hospicloud
# BASE DE DONNEES MYSQL
spring.datasource.url=jdbc:mysql://localhost:3308/hospicloud?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.hibernate.SQL=DEBUG

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jackson.time-zone=UTC

# ===================================================================
# RABBITMQ CONFIG
# ===================================================================

#spring.rabbitmq.uri=amqps://zuvchtgp:uKDtoz8KXKiuUB3nvWuRk8KmTi7Kvx6e@capybara.lmq.cloudamqp.com/zuvchtgp
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.listener.simple.missing-topics-fatal=false



# ===================================================================
# EXCHANGE PRINCIPAL
# ===================================================================
app.rabbit.exchange=rendezvous.exchange

# ===================================================================
# QUEUES PRINCIPALES
# ===================================================================
app.rabbit.queue=rendezvous.queue
app.rabbit.routing-key=rendezvous.#

# Patient
app.rabbit.patient.queue=patient.queue
app.rabbit.patient.routing-key=patient.#

# Medecin
app.rabbit.medecin.queue=medecin.queue
app.rabbit.medecin.routing-key=medecin.#

# Societe
app.rabbit.societe.queue=societe.queue
app.rabbit.societe.routing-key=societe.#

# Antecedent
app.rabbit.antecedent.queue=antecedent.queue
app.rabbit.antecedent.routing-key=antecedent.#

# Async rapports & enregistrements
app.rabbit.rapport.queue=rapport.queue
app.rabbit.enregistrement.queue=enregistrement.queue
app.async.storage-dir=

# ===================================================================
# DEAD LETTER EXCHANGE / QUEUE (DLX / DLQ)
# ===================================================================
app.rabbit.dlx.exchange=rendezvous.dlx.exchange
app.rabbit.dlx.queue=rendezvous.dlq

# ===================================================================
# RETRY CONFIGURATION
# ===================================================================
app.rabbit.retry.queue=rendezvous.retry.queue
app.rabbit.retry.ttl=6000

# ===================================================================
# REDIS — désactivé par défaut en local (pas de serveur Redis requis)
# Activer avec app.redis.enabled=true si Redis tourne sur localhost:6379
# ===================================================================
app.redis.enabled=false
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.timeout=800
spring.jmx.enabled=false

#configuration de GMAIL

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend.base-url=http://localhost:5173
app.password-reset.expiration-minutes=60

# Rappel email téléconsultation (30 min avant, multi-tenant)
app.teleconsultation.reminder.enabled=true
app.teleconsultation.reminder.sms-enabled=true
app.teleconsultation.reminder.minutes-before=30
app.teleconsultation.reminder.window-minutes=2
app.teleconsultation.reminder.cron=0 * * * * ?

# SMS (Twilio) — en dev, laisser app.sms.enabled=false pour simuler dans les logs
app.sms.enabled=false
app.sms.default-country-code=+224
app.sms.twilio.account-sid=
app.sms.twilio.auth-token=
app.sms.twilio.from-number=

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

logging.level.org.springframework.amqp=DEBUG


# Informations LiveKit — clés depuis https://cloud.livekit.io (projet → Settings → Keys)
# Surcharge possible via variables d'environnement LIVEKIT_URL, LIVEKIT_API_KEY, LIVEKIT_API_SECRET
livekit.url=${LIVEKIT_URL:}
livekit.api.key=${LIVEKIT_API_KEY:}
livekit.api.secret=${LIVEKIT_API_SECRET:}

# Configuration locale optionnelle (clés secrètes — ne pas committer)
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# OpenAI / Spring AI — clé via OPENAI_API_KEY ou application-local.properties
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.3
app.ai.enabled=${AI_ENABLED:true}
# Upload pieces jointes archives
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

