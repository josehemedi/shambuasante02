# Profile activé dans le conteneur Docker
spring.application.name=Hospicloud
server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.missing-topics-fatal=false
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10

app.rabbit.exchange=rendezvous.exchange
app.rabbit.rapport.queue=rapport.queue
app.rabbit.enregistrement.queue=enregistrement.queue

app.async.storage-dir=${APP_ASYNC_STORAGE_DIR:/var/hospicloud/async}

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=86400000

app.redis.enabled=${APP_REDIS_ENABLED:false}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.root=INFO
logging.level.hospicloud=INFO
logging.level.org.springframework.amqp=INFO
logging.level.org.hibernate.SQL=WARN

spring.jackson.time-zone=UTC
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# LiveKit — injecté via variables d'environnement du conteneur (.env du VPS)
livekit.url=${LIVEKIT_URL:wss://hospicloud-nz8gfvan.livekit.cloud}
livekit.api.key=${LIVEKIT_API_KEY:}
livekit.api.secret=${LIVEKIT_API_SECRET:}
